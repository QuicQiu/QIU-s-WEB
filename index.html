  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qiuchen Shen — Portfolio</title>
  <link rel="stylesheet" href="/mobile.css" />
  <style>
    *{box-sizing:border-box}
    html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#f4f1ea;font-family:Arial,Helvetica,sans-serif}
    body{cursor:none}
    canvas{display:block;width:100%;height:100%}
    .hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#111}
    .brand{position:absolute;top:22px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);padding:9px 11px;border-radius:999px}
    .help{position:absolute;right:24px;bottom:22px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);padding:9px 11px;border-radius:999px}
    .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;background:rgba(255,255,255,.86);padding:12px 16px;border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
    .progress{width:180px;height:3px;background:#ddd;margin-top:9px;overflow:hidden;border-radius:10px}.bar{height:100%;width:0;background:#222;transition:width .15s linear}
    .error{position:absolute;left:24px;top:70px;max-width:520px;background:#fff3f1;color:#7a1b12;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.5;display:none}
    .scene-hotspots{position:fixed;inset:0;z-index:40;pointer-events:none}
    .scene-hotspot{position:fixed;left:0;top:0;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;pointer-events:auto;cursor:none;opacity:0;transition:opacity .18s ease}
    .scene-hotspot.visible{opacity:1}
    .scene-hotspot .dot{display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 14px rgba(255,255,255,.95);animation:softPulse 1.55s ease-in-out infinite;transition:transform .16s ease,box-shadow .16s ease}
    .scene-hotspot:hover .dot{animation:fastPulse .48s ease-in-out infinite;transform:scale(1.25);box-shadow:0 0 0 5px rgba(255,255,255,.2),0 0 26px rgba(255,255,255,1)}
    .scene-hotspot .tag{position:absolute;left:50%;top:28px;transform:translateX(-50%);white-space:nowrap;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.8);backdrop-filter:blur(7px);font-size:12px;font-weight:700;letter-spacing:.015em;line-height:1;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.04)}
    @keyframes softPulse{0%,100%{opacity:.76;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes fastPulse{0%,100%{opacity:.62}50%{opacity:1}}
    .side-jump{position:fixed;z-index:45;top:78%;transform:translateY(-50%);border:0;background:transparent;display:flex;align-items:center;gap:14px;pointer-events:auto;cursor:none;color:#9d8f7f;opacity:0;visibility:hidden;transition:opacity .22s ease,color .18s ease}
    .side-jump.show{opacity:1;visibility:visible}
    .side-jump:hover{color:#111}
    .side-jump.left{left:22px;text-align:left}
    .side-jump.right{right:22px;text-align:right}
    .side-jump .arrow{width:0;height:0;border-top:25px solid transparent;border-bottom:25px solid transparent}
    .side-jump.left .arrow{border-right:27px solid #050505}
    .side-jump.right .arrow{border-left:27px solid #050505}
    .jump-copy{font-size:14px;font-weight:700;line-height:1.7;letter-spacing:.01em;white-space:nowrap}
    .side-jump.right .jump-copy{order:-1}
    .cursor-dot{position:fixed;z-index:9999;left:0;top:0;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 3px 12px rgba(0,0,0,.13);transform:translate(-50%,-50%);pointer-events:none;transition:width .14s ease,height .14s ease,opacity .14s ease}
    .cursor-dot.active{width:20px;height:20px}
    .cursor-dot.hidden{opacity:0}
    @media (hover:none),(pointer:coarse){body,.scene-hotspot,.side-jump{cursor:auto}.cursor-dot{display:none}}
  </style>
</head>
<body class="home-page">
<div id="app"></div>
<div class="hud">
  <div class="brand">Qiuchen Shen · scene test</div>
  <div class="help">Wheel / drag horizontally</div>
  <div class="loading" id="loading">Loading Rhino FBX…<div class="progress"><div class="bar" id="bar"></div></div></div>
  <div class="error" id="error"></div>
</div>
<div class="scene-hotspots" id="sceneHotspots"></div>
<button class="side-jump left" id="leftJump" aria-label="Back to profile and skills"><span class="arrow"></span><span class="jump-copy">01 PROFILE<br>02 SKILLS</span></button>
<button class="side-jump right" id="rightJump" aria-label="Go to projects"><span class="jump-copy">03 PROJECTS</span><span class="arrow"></span></button>
<div class="cursor-dot" id="cursorDot"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
